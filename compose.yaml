name: travelops-demo

x-runtime: &runtime
  image: travelops-local:dev
  env_file: .env.example
  environment:
    APP_URL: http://localhost:${TRAVELOPS_PORT:-8080}
  volumes:
    - runtime:/run/travelops

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: travelops_demo
      MYSQL_USER: travelops_demo
      MYSQL_PASSWORD: travelops-local-db
      MYSQL_ROOT_PASSWORD: travelops-local-root
    volumes:
      - mysql:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/20-test-db.sql
        target: /docker-entrypoint-initdb.d/20-test-db.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
  init:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["init"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  app:
    <<: *runtime
    ports:
      - "127.0.0.1:${TRAVELOPS_PORT:-8080}:8080"
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 4s
      retries: 12
  queue:
    <<: *runtime
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--timeout=30", "--tries=3"]
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
  scheduler:
    <<: *runtime
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  mysql:
  redis:
  runtime:
